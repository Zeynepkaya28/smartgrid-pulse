packages:
  - "apps/*"
  - "services/*"

# Packages allowed to run install scripts (pnpm 12):
#   supabase      downloads the CLI binary
#   sharp         native image library used by next/image
#   unrs-resolver native module resolver used by eslint-config-next
allowBuilds:
  supabase: true
  sharp: true
  unrs-resolver: true
