# Alternative to Railway. Deploy from this folder:
#   fly launch --no-deploy --copy-config && fly secrets set MQTT_HOST=... && fly deploy
app = "smartgrid-simulator"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HEALTH_PORT = "8080"
  LOG_LEVEL = "INFO"

# Long-running process without public HTTP; Fly only polls the health endpoint.
[checks.healthz]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "15s"
  timeout = "3s"
  grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
