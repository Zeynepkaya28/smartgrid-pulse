[project]
name = "smartgrid-worker"
version = "0.1.0"
description = "Telemetry ingestion and anomaly detection worker for SmartGrid Pulse."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "aiomqtt>=2.5.1",
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
smartgrid-worker = "worker.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
smartgrid-simulator = { path = "../simulator", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "ANN"]
# User-facing text is Turkish: dotless/dotted I are intentional.
allowed-confusables = ["ı", "İ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sklearn.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "smartgrid-simulator>=0.1.0",
]
