# Eclipse Mosquitto — LOCAL DEVELOPMENT ONLY.
#
# Production uses HiveMQ Cloud. A self-hosted production broker would need:
#   - TLS only:            listener 8883 + cafile / certfile / keyfile, no plain 1883
#   - authentication:      allow_anonymous false + password_file /mosquitto/config/passwd
#                          (create it with: mosquitto_passwd -c passwd <user>)
#   - authorization:       acl_file restricting smartgrid/cmd/# to the dashboard user

listener 1883 0.0.0.0
protocol mqtt

# Anonymous access is acceptable only on a developer machine.
allow_anonymous true

# Keep retained messages (smartgrid/sim/faults) and QoS1 sessions across restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
